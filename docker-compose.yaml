services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chedly
      MYSQL_DATABASE: chedlyRebai4twin5_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pchedly"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-smartsite:
    image: postgres:16
    container_name: postgres-smartsite
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartsite
      POSTGRES_USER: smartsite
      POSTGRES_PASSWORD: smartsite
    ports:
      - "5433:5432"
    volumes:
      - postgres-smartsite-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsite -d smartsite"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-smartsite
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: smartsite
      KC_DB_USERNAME: smartsite
      KC_DB_PASSWORD: smartsite
      KC_HTTP_PORT: 8080
    depends_on:
      postgres-smartsite:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: planing
      POSTGRES_USER: chedly
      POSTGRES_PASSWORD: chedly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chedly -d planing"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbit-mq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # protocol
      - "15672:15672" # UI
    environment:
      RABBITMQ_DEFAULT_USER: chedly
      RABBITMQ_DEFAULT_PASS: chedly
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    depends_on:
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8070:8070"

  incident:
    build:
      context: ./incident
    container_name: incident
    restart: unless-stopped
    depends_on:
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "30332:30332"

  planing:
    build:
      context: ./planing
    container_name: planing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbit-mq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      PLANING_DB_URL: jdbc:postgresql://postgres:5432/planing
      PLANING_DB_USERNAME: chedly
      PLANING_DB_PASSWORD: chedly
      SPRING_RABBITMQ_HOST: rabbit-mq
    ports:
      - "9998:9998"

  notification:
    build:
      context: ./notification
    container_name: notification
    restart: unless-stopped
    depends_on:
      rabbit-mq:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbit-mq
    ports:
      - "9997:9997"

  service-user:
    build:
      context: ./service-user
    container_name: service-user
    restart: unless-stopped
    depends_on:
      postgres-smartsite:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      PLANING_DB_URL: jdbc:postgresql://postgres-smartsite:5432/smartsite
      PLANING_DB_USERNAME: smartsite
      PLANING_DB_PASSWORD: smartsite
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-smartsite:5432/smartsite
      SPRING_DATASOURCE_USERNAME: smartsite
      SPRING_DATASOURCE_PASSWORD: smartsite
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  mysql-data:
    driver: local
  postgres-smartsite-data:
    driver: local
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local