services:
  # =============================================
  # BASE DE DONNÉES POSTGRES (pour planning)
  # =============================================
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=planing'
      - 'POSTGRES_PASSWORD=chedly'
      - 'POSTGRES_USER=chedly'
    ports:
      - '5432:5432'
    networks:
      - smartsite-network

  # =============================================
  # RABBITMQ (messaging)
  # =============================================
  rabbit-mq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: chedly
      RABBITMQ_DEFAULT_PASS: chedly
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - smartsite-network

  # =============================================
  # MYSQL (pour les autres microservices)
  # =============================================
  mysqldb:
    image: mysql:5.6
    container_name: db
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=chedlyRebai4twin5_db
    networks:
      - smartsite-network

  # =============================================
  # EUREKA SERVER (Service Discovery)
  # =============================================
  eureka-server:
    build: ./eureka-server
    image: inesmjd/eureka:2.0
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    networks:
      - smartsite-network

  # =============================================
  # CONFIG SERVER
  # =============================================
  config-server:
    build: ./config-server
    image: inesmjd/configserver:2.0
    container_name: ConfigServer
    ports:
      - "8686:8686"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
    networks:
      - smartsite-network

  # =============================================
  # SERVICE MATERIAU (NOUVEAU - avec IA et prédictions)
  # =============================================
  service-materiau:
    build: ./service-materiau
    image: tonuser/service-materiau:latest
    container_name: service-materiau
    ports:
      - "8086:8086"
    depends_on:
      - mysqldb
      - eureka-server
      - config-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8686
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/chedlyRebai4twin5_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/smartsite
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/smartsite/protocol/openid-connect/certs
    networks:
      - smartsite-network

  # =============================================
  # KEYCLOAK (Authentication)
  # =============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak
    restart: always
    command: start-dev --http-port=8080
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_DB=dev-file
    ports:
      - "8080:8080"
    volumes:
      - ./data/keycloak:/opt/keycloak/data
    networks:
      - smartsite-network

  # =============================================
  # API GATEWAY
  # =============================================
  API-gateway:
    build: ./api-gateway
    image: inesmjd/apigateway:sae.1
    container_name: gateway
    ports:
      - "8088:8088"
    depends_on:
      - eureka-server
      - config-server
      - service-materiau
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8686
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/smartsite
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/smartsite/protocol/openid-connect/certs
    networks:
      - smartsite-network

  # =============================================
  # FRONTEND (React)
  # =============================================
  frontend:
    build: ./frontend
    image: tonuser/smartsite-frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - API-gateway
      - keycloak
    environment:
      - REACT_APP_API_URL=http://localhost:8088
      - REACT_APP_KEYCLOAK_URL=http://localhost:8080
    networks:
      - smartsite-network

# =============================================
# VOLUMES
# =============================================
volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

# =============================================
# NETWORKS
# =============================================
networks:
  smartsite-network:
    driver: bridge