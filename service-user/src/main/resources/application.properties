
# Application Name (used for Eureka registration)
spring.application.name=service-gestion-user
spring.config.import=optional:configserver:http://localhost:8888

# Server Port
server.port=8082


spring.datasource.url=jdbc:mysql://localhost:3306/chedlyRebai4twin5_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=chedly
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

    
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
