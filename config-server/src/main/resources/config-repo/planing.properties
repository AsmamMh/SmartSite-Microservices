server.port=9998
spring.datasource.url=${PLANING_DB_URL:jdbc:postgresql://127.0.0.1:5432/smartsite}
spring.datasource.username=${PLANING_DB_USERNAME:smartsite}
spring.datasource.password=${PLANING_DB_PASSWORD:smartsite}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chedly
spring.rabbitmq.password=chedly
