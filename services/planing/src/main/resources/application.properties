spring.application.name=planing
spring.config.import=optional:configserver:http://localhost:8888
server.port=9998
spring.datasource.url=${PLANING_DB_URL:jdbc:postgresql://127.0.0.1:5432/smartsite}
spring.datasource.username=${PLANING_DB_USERNAME:smartsite}
spring.datasource.password=${PLANING_DB_PASSWORD:smartsite}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chedly
spring.rabbitmq.password=chedly
# RabbitMQ Connection Resilience
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=30
spring.rabbitmq.requested-channel-max=2048
spring.rabbitmq.cache.channel.size=10
spring.rabbitmq.cache.connection.mode=CONNECTION
# RabbitMQ Listener Retry Policy
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =============================================
# EUREKA CONFIGURATION
# =============================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true