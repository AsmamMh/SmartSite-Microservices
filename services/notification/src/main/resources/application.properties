spring.application.name=notification
server.port=8084
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=chedly
spring.rabbitmq.password=chedly

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/planing?createDatabaseIfNotExist=true
spring.datasource.username=mazraa
spring.datasource.password=mazraa
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# EUREKA CONFIGURATION
# =============================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true