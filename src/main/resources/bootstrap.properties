# =============================================
# SPRING CLOUD CONFIG - BOOTSTRAP
# =============================================
# This file is loaded BEFORE application.properties

# Application name (must match config server file name)
spring.application.name=service-gestion-chantier

# Config Server URI (Spring Cloud Config Server)
spring.cloud.config.uri=http://localhost:8888

# Enable config server
spring.cloud.config.enabled=true

# Enable discovery client (for service discovery)
spring.cloud.discovery.enabled=true

# Fail fast if config server is not available (set to false for development)
spring.cloud.config.fail-fast=false

# Retry interval in milliseconds
spring.cloud.config.retry.interval=1000

# Max retries
spring.cloud.config.retry.max-attempts=6
