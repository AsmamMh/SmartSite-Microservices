
spring.application.name=service-gestion-incidents
spring.config.import=optional:configserver:http://localhost:8888

# Server Port
server.port=30332


# spring.datasource.url=jdbc:mysql://localhost:3306/chedlyRebai4twin5_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
