# =============================================
# MICRO SERVICE CONFIGURATION
# =============================================
spring.application.name=service-gestion-chantier
spring.config.import=optional:configserver:http://localhost:8888

server.port=8082

# =============================================
# DATABASE CONFIGURATION - PORT 3307
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3307/chantier_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# EUREKA CONFIGURATION
# =============================================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info