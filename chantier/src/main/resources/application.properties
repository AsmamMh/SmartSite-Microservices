# =============================================
# MICRO SERVICE CONFIGURATION
# =============================================

# Application Name (used for Eureka registration)
spring.application.name=service-gestion-chantier
spring.config.import=optional:configserver:http://localhost:8888

# Server Port
server.port=8089

# =============================================
# DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/chedlyRebai4twin5_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=chedly
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# EUREKA CONFIGURATION (Service Discovery)
# =============================================
# eureka.client.enabled=true
# eureka.client.register-with-eureka=true
# eureka.client.fetch-registry=true
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
# eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================
# SPRING CLOUD CONFIG (External Configuration)
# =============================================
spring.cloud.config.enabled=true
spring.cloud.discovery.enabled=true

# =============================================
# ACTUATOR (Monitoring & Health Checks)
# =============================================
# management.endpoints.web.exposure.include=*
# management.endpoint.health.show-details=always
# management.endpoints.web.base-path=/actuator
# management.health.defaults.enabled=true

# =============================================
# LOGGING
# =============================================
# logging.level.com.esprit=DEBUG

    
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
