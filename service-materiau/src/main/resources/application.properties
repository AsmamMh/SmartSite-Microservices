# =============================================
# MICRO SERVICE CONFIGURATION
# =============================================
spring.application.name=service-materiau
spring.config.import=optional:configserver:http://localhost:8888

server.port=8083

# =============================================
# DATABASE CONFIGURATION - PORT 3307
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3307/materiau_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# EUREKA CONFIGURATION (désactivé pour test)
# =============================================
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# =============================================
# FEIGN CLIENT - URL directe
# =============================================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# URL directe du service chantier (sans Eureka)
chantier.service.url=http://localhost:8082

# =============================================
# LOGGING
# =============================================
logging.level.tn.esprit.microservice.servicemateriau=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG