# =============================================
# MICRO SERVICE CONFIGURATION
# =============================================

# Application Name
spring.application.name=service-materiau
spring.config.import=optional:configserver:http://localhost:8888

# Server Port
server.port=8086

# =============================================
# DATABASE CONFIGURATION (CORRIGÉE)
# =============================================
# Changement du port 3307 → 3306 (port MySQL par défaut)
# Ajout de allowPublicKeyRetrieval=true et useSSL=false
spring.datasource.url=jdbc:mysql://localhost:3306/service-materiau?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# EUREKA CONFIGURATION
# =============================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =============================================
# SECURITY - KEYCLOAK (ACTIVÉ)
# =============================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/smartsite/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/smartsite

# =============================================
# FEIGN CLIENT
# =============================================
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# =============================================
# LOGGING
# =============================================
logging.level.tn.esprit.microservice.servicemateriau=DEBUG