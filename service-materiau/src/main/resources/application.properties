# =============================================
# MICRO SERVICE CONFIGURATION
# =============================================

# Application Name (used for Eureka registration)
spring.application.name=service-materiau
spring.config.import=optional:configserver:http://localhost:8888

# Server Port
server.port=8086

# =============================================
# DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/chedlyRebai4twin5_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:chedly}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# EUREKA CONFIGURATION (Service Discovery)
# =============================================
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =============================================
# ACTUATOR (Monitoring & Health Checks)
# =============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# =============================================
# FEIGN CLIENT CONFIGURATION
# =============================================
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# =============================================
# JACKSON CONFIGURATION
# =============================================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# =============================================
# LOGGING
# =============================================
logging.level.com.esprit=DEBUG